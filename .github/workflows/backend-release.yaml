name: Backend image and GitOps

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-release.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/snuhcs-course/swpp-2026-project-team-14-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            ./backend

      - name: Test API inside container
        run: |
          docker run -d --name backend-test \
            -p 127.0.0.1:8000:8000 \
            "$IMAGE:sha-$GITHUB_SHA"
          trap 'docker logs backend-test; docker rm -f backend-test' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:8000/api/hello/ \
            | python -c 'import json,sys; assert json.load(sys.stdin) == {"message": "Hello, world!"}'

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: docker push "$IMAGE:sha-$GITHUB_SHA"

      - name: Update deployment image in Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            # Do not deploy an older build over newer backend changes.
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- backend .github/workflows/backend-release.yaml; then
              echo "Newer backend changes exist; skip this deployment."
              exit 0
            fi

            git checkout -B gitops-update origin/main

            sed -i \
              "s|image: $IMAGE:.*|image: $IMAGE:sha-$GITHUB_SHA|" \
              infra/apps/backend.yaml

            grep -Fq "image: $IMAGE:sha-$GITHUB_SHA" infra/apps/backend.yaml

            git add infra/apps/backend.yaml

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "deploy: backend sha-$GITHUB_SHA"

            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done

          echo "Push failed. Check branch protection and Actions permissions."
          exit 1
