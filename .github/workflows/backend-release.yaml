# AI-generated with Codex, 2026-09-24, reviewed by Kihwan Kim
name: Backend deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-release.yaml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      IMAGE: ghcr.io/snuhcs-course/swpp-2026-project-team-14-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            ./backend

      - name: Login to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | \
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        run: docker push "$IMAGE:sha-$GITHUB_SHA"

      - name: Update deployment image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sed -i \
            "s|image: $IMAGE:.*|image: $IMAGE:sha-$GITHUB_SHA|" \
            infra/apps/backend.yaml

          git add infra/apps/backend.yaml
          if git diff --cached --quiet; then
            echo "Deployment already uses this image."
            exit 0
          fi
          git commit -m "deploy: backend sha-$GITHUB_SHA"
          git pull --rebase origin main
          git push origin HEAD:main