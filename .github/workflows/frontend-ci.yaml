# AI-generated with Claude Code (Claude Opus 5.5), 2026-09-25, reviewed by Dongkun Moon
name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure school API endpoint
        run: printf '%s\n' 'stylemate.apiBaseUrl=http://swpp26t14.147-46-242-169.sslip.io' >> local.properties

      - name: Unit tests with coverage
        run: ./gradlew --no-daemon createDebugUnitTestCoverageReport

      - name: Coverage by layer
        run: python3 scripts/coverage_by_layer.py app/build/reports/coverage/test/debug/report.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-coverage
          path: frontend/app/build/reports/coverage/test/debug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stylemate-debug-apk
          path: frontend/app/build/outputs/apk/debug/app-debug.apk
