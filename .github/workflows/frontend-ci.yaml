# AI-generated with Claude Code (Claude Opus 5.5), 2026-09-25, reviewed by Dongkun Moon
name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure school API endpoint
        run: printf '%s\n' 'stylemate.apiBaseUrl=http://swpp26t14.147-46-242-169.sslip.io' >> local.properties

      - name: Unit tests with coverage
        run: ./gradlew --no-daemon createDebugUnitTestCoverageReport

      - name: Coverage by layer
        run: |
          python3 scripts/coverage_by_layer.py app/build/reports/coverage/test/debug/report.xml >> "$GITHUB_STEP_SUMMARY"
          echo '### Virtual fitting: JVM tests only' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage_by_layer.py app/build/reports/coverage/test/debug/report.xml --package-prefix com/swpp/stylemate/data/tryon --package-prefix com/swpp/stylemate/ui/tryon >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-coverage
          path: |
            frontend/app/build/reports/coverage/test/debug
            frontend/app/build/reports/tests/testDebugUnitTest
            frontend/app/build/test-results/testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stylemate-debug-apk
          path: frontend/app/build/outputs/apk/debug/app-debug.apk

  fitting-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Fitting and app stability device tests with coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: frontend
          disable-animations: true
          script: |
            ./gradlew --no-daemon -PandroidTestCoverage assembleDebug assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.swpp.stylemate android.permission.POST_NOTIFICATIONS
            ./gradlew --no-daemon -PandroidTestCoverage -Pandroid.testInstrumentationRunnerArguments.class=com.swpp.stylemate.home.PhotoFittingTest,com.swpp.stylemate.home.UsageDisplayTest,com.swpp.stylemate.home.HomeRegionSelectionTest,com.swpp.stylemate.data.tryon.FittingWorkerTest,com.swpp.stylemate.data.tryon.FittingFlowTest,com.swpp.stylemate.data.usage.StabilityDeviceTest createDebugAndroidTestCoverageReport createAggregatedCoverageReport
            ./gradlew --no-daemon assembleRelease
            keytool -genkeypair -keystore "$RUNNER_TEMP/release-policy-test.p12" -storetype PKCS12 -storepass android -keypass android -alias release-policy-test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Release Policy Test' -noprompt
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release-policy-test.p12" --ks-key-alias release-policy-test --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/release-policy-check.apk app/build/outputs/apk/release/app-release-unsigned.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release-policy-test.p12" --ks-key-alias release-policy-test --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/release-policy-instrumentation.apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            if adb -e shell pm path com.swpp.stylemate.test | grep -q '^package:'; then adb -e uninstall com.swpp.stylemate.test; fi
            if adb -e shell pm path com.swpp.stylemate | grep -q '^package:'; then adb -e uninstall com.swpp.stylemate; fi
            adb -e install -r app/build/outputs/apk/release/release-policy-check.apk
            adb -e install -r app/build/outputs/apk/release/release-policy-instrumentation.apk
            mkdir -p app/build/reports/release-network-policy
            adb -e shell am instrument -w -r -e verifyReleaseNetworkPolicy true -e class com.swpp.stylemate.network.ReleaseNetworkPolicyTest com.swpp.stylemate.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/reports/release-network-policy/results.txt
            grep -Fq 'OK (3 tests)' app/build/reports/release-network-policy/results.txt
            ! grep -Eq 'INSTRUMENTATION_STATUS_CODE: -[1-4]' app/build/reports/release-network-policy/results.txt

      - name: Fitting coverage summary
        run: |
          echo '### Virtual fitting: combined JVM and device tests' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/coverage_by_layer.py app/build/intermediates/aggregated_code_coverage_data/global/collectDebugAggregatedCoverage/debugAppAggregatedXmlReport.xml --package-prefix com/swpp/stylemate/data/tryon --package-prefix com/swpp/stylemate/ui/tryon >> "$GITHUB_STEP_SUMMARY"

      - name: Upload fitting test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitting-device-test-coverage
          path: |
            frontend/app/build/reports/androidTests/connected/debug
            frontend/app/build/reports/coverage
            frontend/app/build/reports/release-network-policy
            frontend/app/build/outputs/androidTest-results/connected/debug
            frontend/app/build/intermediates/aggregated_code_coverage_data/global/collectDebugAggregatedCoverage/debugAppAggregatedXmlReport.xml
