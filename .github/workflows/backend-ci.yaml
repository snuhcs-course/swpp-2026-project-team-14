# AI-generated with Claude Code (Dongkun Moon) and Codex (Hyeon U Jeong), 2026-09-25, reviewed by Dongkun Moon and Hyeon U Jeong
name: Backend CI

# Runs on every PR and push that touches backend/, so broken code is caught before it reaches
# main (backend-release.yaml deploys main automatically).
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: MySQL client build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q
          python manage.py test apps.wardrobe --settings=config.test_settings --noinput

  image:
    # Builds the production image and checks that the pose model loads inside it
    # (catches missing system libraries, e.g. libEGL, that local tests on Windows/macOS cannot).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t backend-ci ./backend

      - name: Pose model loads in the image
        run: >
          docker run --rm backend-ci python -c
          "from body_analysis.pose import MediaPipePoseEstimator; MediaPipePoseEstimator().close(); print('ok')"

      - name: Wardrobe model runs in the image
        run: >
          docker run --rm backend-ci python -c
          "import numpy as np; from apps.wardrobe.landmarks import session;
          output = session().run(None, {'image': np.zeros((1, 3, 384, 288), dtype=np.float32)})[0];
          assert output.shape == (1, 294, 96, 72); assert np.isfinite(output).all(); print('ok')"

      - name: Server answers health checks
        run: |
          docker run -d --name backend-ci -p 8000:8000 backend-ci
          for i in $(seq 1 30); do curl -sf -H "Host: localhost" http://localhost:8000/healthz/ && exit 0; sleep 1; done
          docker logs backend-ci
          exit 1
