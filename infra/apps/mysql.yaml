apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: team14
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
          envFrom:
            - secretRef:
                name: mysql-secret
          ports:
            - name: mysql
              containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            exec:
              command: ["mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: team14
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
