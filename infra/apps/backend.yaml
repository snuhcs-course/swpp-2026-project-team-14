# AI-generated with Claude Code (Dongkun Moon) and Codex (Kihwan Kim), 2026-09-24, reviewed by Dongkun Moon and Kihwan Kim
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: team14
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/snuhcs-course/swpp-2026-project-team-14-backend:sha-f273147f634d84f52a5ff82cbaf85a0cb011a576
          ports:
            - name: http
              containerPort: 8000
          resources:
            # The body-analysis model uses ~340 MiB in the container (measured); with 256Mi it is OOM-killed.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: team14
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: http
