apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: team14
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 1200
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        # Runs before the new server starts. Kubernetes retries if MySQL is still starting.
        # The release workflow updates BOTH occurrences of this image.
        - name: migrate
          image: ghcr.io/snuhcs-course/swpp-2026-project-team-14-backend:sha-f273147f634d84f52a5ff82cbaf85a0cb011a576
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: backend
          image: ghcr.io/snuhcs-course/swpp-2026-project-team-14-backend:sha-f273147f634d84f52a5ff82cbaf85a0cb011a576
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          ports:
            - name: http
              containerPort: 8000
          resources:
            # Initial budget, not a measured concurrent-load guarantee.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: wardrobe-media
              mountPath: /app/private/wardrobe-media
          startupProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: wardrobe-media
          persistentVolumeClaim:
            claimName: wardrobe-media
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: team14
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
