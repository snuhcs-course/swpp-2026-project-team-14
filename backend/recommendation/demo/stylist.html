<!doctype html>
<!-- AI-generated with Claude Code (Claude Opus 5.5), 2026-10-11, reviewed by Dongkun Moon -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 스타일리스트 테스트</title>
<style>
  :root { --tc:#C4552B; --tc-soft:#F6DDD2; --tc-ink:#8A3312; --cream:#F8F6F2; --sand:#F1ECE6; --ink:#1F1B18;
          --muted:#8A8580; --line:#E4DED7; --good:#3F8F5A; --warn:#D9A13B; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; background:var(--cream); color:var(--ink); }
  header { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; padding:12px 18px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; font-weight:800; }
  header .meta { font-size:12px; color:var(--muted); }
  header a { font-size:12px; color:var(--tc); margin-left:auto; }
  .wrap { display:grid; grid-template-columns:300px minmax(340px,1fr) minmax(380px,1.1fr); gap:14px; padding:14px; max-width:1500px; margin:0 auto; }
  @media (max-width:1100px) { .wrap { grid-template-columns:1fr; } }
  .col { display:grid; gap:12px; align-content:start; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px; }
  .panel h2 { font-size:13px; font-weight:800; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .muted { color:var(--muted); font-size:12px; }
  label.row { display:grid; grid-template-columns:64px 1fr; gap:6px; align-items:center; font-size:12px; margin:4px 0; }
  input, select { width:100%; border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; font-size:13px; background:#fff; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; }
  .seg { display:flex; background:var(--sand); border-radius:10px; padding:3px; gap:3px; }
  .seg button { flex:1; border:0; background:transparent; padding:6px 0; border-radius:8px; font:inherit; font-size:12px; color:var(--muted); cursor:pointer; }
  .seg button.on { background:#fff; color:var(--ink); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:4px 9px; font-size:12px; background:#fff; cursor:pointer; user-select:none; }
  .chip.on { background:var(--tc-soft); border-color:var(--tc); color:var(--tc-ink); font-weight:700; }
  .btn { border:0; border-radius:10px; padding:9px 12px; font:inherit; font-weight:700; cursor:pointer; font-size:13px; }
  .btn.primary { background:var(--tc); color:#fff; } .btn.ghost { background:#fff; border:1px solid var(--line); }
  .wx { display:flex; align-items:center; gap:10px; margin-top:8px; }
  .wx b { font-size:22px; } .wx span { font-size:12px; color:var(--muted); }
  .board { position:relative; height:330px; border-radius:14px; background:linear-gradient(180deg,#FBF9F6,var(--sand)); overflow:hidden; }
  .board .p { position:absolute; display:flex; align-items:center; justify-content:center; transition:all .35s; }
  .board img { max-width:100%; max-height:100%; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.13)); }
  .board .p.changed::after { content:"NEW"; position:absolute; top:4px; right:4px; font-size:9px; background:var(--tc); color:#fff; border-radius:6px; padding:1px 5px; }
  .own { width:86%; height:72%; border:2px dashed var(--tc); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:12px; background:rgba(255,255,255,.75); text-align:center; padding:6px; }
  .sw { width:34px; height:34px; border-radius:50%; border:1px solid rgba(0,0,0,.15); display:inline-block; }
  .bars { display:grid; gap:5px; margin-top:10px; }
  .bar { display:grid; grid-template-columns:52px 1fr 28px; gap:8px; align-items:center; font-size:12px; }
  .track { height:7px; background:var(--sand); border-radius:99px; overflow:hidden; } .fill { height:100%; background:var(--tc); }
  .reason { font-size:12.5px; line-height:1.5; background:var(--cream); border-radius:10px; padding:7px 9px; margin-top:6px; }
  .reason small, .rule small { display:block; color:var(--muted); font-size:11px; }
  .rule { font-size:12px; padding:6px 8px; border-radius:9px; background:#F3F8F4; margin-top:5px; }
  .rule.neg { background:#FBEFEB; }
  .rule a { color:var(--muted); }
  .items { display:grid; gap:6px; margin-top:8px; }
  .item { display:grid; grid-template-columns:46px 1fr; gap:8px; align-items:center; font-size:12.5px; }
  .thumb { width:46px; height:54px; background:var(--sand); border-radius:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .thumb img { max-width:42px; max-height:50px; object-fit:contain; }
  .size { font-size:11px; color:#2E6B44; }
  .examples { margin-top:8px; }
  .turn { border-top:1px dashed var(--line); padding-top:10px; margin-top:10px; }
  .turn .q { font-weight:700; font-size:13px; }
  .intent { font-size:11.5px; color:var(--muted); margin:4px 0 6px; }
  .intent code, .state code { background:var(--sand); border-radius:6px; padding:1px 5px; font-size:11px; }
  .dec { border:1px solid var(--line); border-radius:12px; padding:8px; margin-top:6px; }
  .dec .h { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; }
  .pill { font-size:10.5px; border-radius:999px; padding:2px 8px; font-weight:700; }
  .pill.applied { background:#E7F2EA; color:#2E6B44; } .pill.kept { background:var(--sand); color:#6b645e; } .pill.confirm { background:#FFF3DC; color:#8a5d10; }
  .opt { display:grid; grid-template-columns:28px 1fr 46px; gap:6px; align-items:center; font-size:11.5px; margin-top:4px; }
  .opt .t { width:28px; height:32px; background:var(--sand); border-radius:6px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .opt .t img { max-width:26px; max-height:30px; }
  .opt .pb { height:6px; background:var(--sand); border-radius:99px; overflow:hidden; margin-top:2px; }
  .opt .pb div { height:100%; background:var(--tc); }
  .opt.chosen { font-weight:700; }
  .lat { font-size:11px; color:var(--muted); margin-top:6px; }
  details summary { cursor:pointer; font-size:12px; color:var(--muted); }
  pre { white-space:pre-wrap; font-size:11px; background:var(--sand); border-radius:8px; padding:8px; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:12px; } td, th { padding:4px 6px; border-bottom:1px solid var(--line); text-align:left; }
  .note { background:#FFF7E8; border:1px solid #F1D9A8; color:#7A5A16; border-radius:10px; padding:7px 10px; font-size:12px; margin-top:6px; }
  .loading { opacity:.5; pointer-events:none; }
</style>
</head>
<body>
<header><h1>AI 스타일리스트 · Jev 방식 결정 테스트</h1><span class="meta" id="meta">불러오는 중…</span><a href="/">← 코디 추천 테스트</a></header>
<div class="wrap">
  <div class="col">
    <div class="panel">
      <h2>체형 <span class="seg" style="width:140px"><button data-preset="female" class="on">여성</button><button data-preset="male">남성</button></span></h2>
      <div class="grid2">
        <label class="row">키<input id="height" type="number"></label><label class="row">가슴<input id="chest" type="number"></label>
        <label class="row">허리<input id="waist" type="number"></label><label class="row">엉덩이<input id="hip" type="number"></label>
        <label class="row">어깨<input id="shoulder" type="number"></label><label class="row">다리<input id="inseam" type="number"></label>
      </div>
      <label class="row" style="margin-top:6px">골격 진단<select id="bone"><option value="">모름</option><option>스트레이트</option><option>웨이브</option><option>내추럴</option></select></label>
      <p class="muted" id="shape"></p>
    </div>
    <div class="panel">
      <h2>선호</h2>
      <div class="seg" id="fit"><button data-v="slim">슬림핏</button><button data-v="regular" class="on">레귤러핏</button><button data-v="loose">루즈핏</button></div>
      <div class="chips" id="styles" style="margin-top:8px"></div>
    </div>
    <div class="panel">
      <h2>날씨 <button class="btn ghost" id="wxbtn" style="padding:5px 9px;font-size:12px">현재 날씨 가져오기</button></h2>
      <div class="wx"><b id="wxtemp">17°</b><span id="wxlabel">직접 입력</span></div>
      <input id="temp" type="range" min="-8" max="34" value="17" style="accent-color:var(--tc)">
    </div>
    <div class="panel">
      <h2>상황</h2>
      <div class="chips" id="occasion"></div>
    </div>
    <div class="panel">
      <h2>내 옷장 <span class="muted">결정 보기에 포함</span></h2>
      <div id="ward" class="items"></div>
    </div>
    <div class="panel">
      <h2>정답률·보정 <span class="muted">검증 코디</span></h2>
      <table id="report"></table>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <h2>지금 코디 <button class="btn ghost" id="newbtn" style="padding:5px 9px;font-size:12px">새 코디로 시작</button></h2>
      <div class="board" id="board"></div>
      <div class="bars" id="bars"></div>
      <div id="reasons"></div>
      <div class="items" id="items"></div>
    </div>
    <div class="panel">
      <h2>적용된 체형 규칙 <span class="muted">출처 포함</span></h2>
      <div id="rules"><span class="muted">아직 없어요</span></div>
    </div>
    <div class="panel">
      <h2>팀원 모델: 빈 슬롯 예측 <span class="muted">마스킹 트랜스포머</span></h2>
      <div id="predicted" class="muted">아직 없어요</div>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <h2>예시 요청으로 바꿔 보기 <span class="muted" id="decider"></span></h2>
      <p class="muted">자유 입력 채팅은 채팅 기능(주현 님)에서 다뤄요. 여기서는 정해진 예시 요청을 키워드 규칙으로 읽어요.</p>
      <div class="chips examples" id="examples"></div>
      <div id="turns"></div>
    </div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const PRESETS = {
  female: {gender:"female", height:162, chest:84, waist:68, hip:94, shoulder:38, inseam:72},
  male: {gender:"male", height:175, chest:96, waist:82, hip:96, shoulder:46, inseam:80},
};
const KCOLORS = {"블랙":"#1E1E1E","화이트":"#F7F7F5","그레이":"#9A9A9A","베이지":"#D8C3A5","브라운":"#7B5134","네이비":"#1F2A44","카키":"#6B6B3A","스카이블루":"#9CC9EA","블루":"#2F5DA8","핑크":"#F2A7BC","레드":"#C62F2F","와인":"#722F37","오렌지":"#E8833A","옐로우":"#EED35A","그린":"#3F8F4F","민트":"#A8E0CF","라벤더":"#C3B4E6","퍼플":"#7A4FA0","실버":"#C0C0C0","골드":"#C9A447","네온":"#C6F432"};
const WARDROBE = [
  {id:"w1", attributes:{name:"흰 반팔 티셔츠", category:"top", subcategory:"tshirt", colors:["#FFFFFF"], fit_type:"regular"}, dimensions:{chest_width_half:50}},
  {id:"w2", attributes:{name:"연청 청바지", category:"bottom", subcategory:"jeans", colors:["#3975C6"], leg_shape:"straight"}, dimensions:{waist_width_half:35, hip_width_half:51}},
  {id:"w4", attributes:{name:"베이지 트렌치코트", category:"outerwear", subcategory:"coat", colors:["#D6BE9A"], fit_type:"loose"}, dimensions:{chest_width_half:58}},
  {id:"w5", attributes:{name:"네이비 니트", category:"top", subcategory:"knitwear", colors:["#24344B"], fit_type:"loose"}, dimensions:{chest_width_half:54}},
];
const EXAMPLES = ["비 오니까 따뜻하게 해줘", "상의만 밝은 색으로 바꿔줘", "출근용으로 단정하게", "좀 더 편하고 넉넉하게", "하의는 내 청바지로", "새 코디 추천해줘"];
const OCC = ["출근", "데이트", "캐주얼", "운동", "여행"];
const LAYOUT = {
  "상의+하의": {"상의":[8,4,84,46], "하의":[22,46,56,52]},
  "아우터+상의+하의": {"아우터":[2,6,52,76], "상의":[52,2,46,44], "하의":[56,44,40,54]},
  "원피스": {"원피스":[18,3,64,94]}, "아우터+원피스": {"아우터":[2,6,50,76], "원피스":[46,4,52,92]},
  "아우터+상의": {"아우터":[2,6,52,80], "상의":[50,10,48,60]}, "아우터+하의": {"아우터":[2,6,52,76], "하의":[54,20,42,76]},
  "상의": {"상의":[15,10,70,80]}, "하의": {"하의":[20,6,60,88]},
};
const S = { fit:"regular", styles:new Set(["미니멀"]), occasion:null, weather:null, current:{}, items:{}, seed:1,
            pref: (() => { try { return JSON.parse(localStorage.getItem("reco:pref")) || null; } catch { return null; } })() };
async function api(path, body) {
  const r = await fetch(path, {method: body ? "POST" : "GET", headers: {"Content-Type":"application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j;
}
function profile() {
  const p = {pref_fit:S.fit, styles:[...S.styles], bone:$("#bone").value};
  for (const k of ["height","chest","waist","hip","shoulder","inseam"]) p[k] = $("#"+k).value;
  p.gender = S.gender; return p;
}
function setPreset(n) { const p = PRESETS[n]; S.gender = p.gender; for (const k in p) if ($("#"+k)) $("#"+k).value = p[k];
  document.querySelectorAll("[data-preset]").forEach(b => b.classList.toggle("on", b.dataset.preset === n)); hint(); }
function hint() { const c=+$("#chest").value, w=+$("#waist").value, h=+$("#hip").value; let s="판정 보류";
  if (h/c>=1.10) s="하체 볼륨형"; else if (c/h>=1.10) s="상체 볼륨형"; else if (w/h<=0.70) s="허리 라인형"; else if (w/h>=0.80) s="일자형";
  $("#shape").textContent = `측정 체형: ${s} · 다리 비율 ${(+$("#inseam").value/+$("#height").value).toFixed(2)}`; }
function weatherPayload() { return S.weather || {temp:+$("#temp").value, apparent:+$("#temp").value, precipitation:0, rain:false, snow:false, wind:0, label:"직접 입력", source:"manual"}; }
function piece(it) {
  if (it.image) return `<img src="${it.image}" alt="${it.name}">`;
  return `<div class="own"><span class="sw" style="background:${KCOLORS[it.attrs?.["색상"]]||"#ccc"}"></span><b>내 옷</b>${it.name}</div>`;
}
function thumb(it) { return it?.image ? `<img src="${it.image}">` : `<span class="sw" style="width:22px;height:22px;background:${KCOLORS[it?.attrs?.["색상"]]||"#ddd"}"></span>`; }
function renderOutfit(o) {
  const lay = LAYOUT[o.template] || {};
  $("#board").innerHTML = o.items.map(it => { const [x,y,w,h] = lay[it.slot] || [10,10,80,80];
    return `<div class="p ${it.changed ? "changed" : ""}" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%">${piece(it)}</div>`; }).join("");
  const c = o.components, bar = (l,v) => `<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${v}%"></div></div><span class="muted">${v}</span></div>`;
  $("#bars").innerHTML = bar("궁합", c.compat) + bar("체형·핏", c.body) + bar("배색", c.color) + bar("날씨", c.season);
  $("#reasons").innerHTML = o.reasons.map(r => `<div class="reason">${r.text}${r.sub ? `<small>${r.sub}</small>` : ""}</div>`).join("");
  $("#items").innerHTML = o.items.map(it => `<div class="item"><div class="thumb">${thumb(it)}</div><div><b>${it.name}</b>${it.source==="wardrobe"?" · 내 옷":""}<div class="size">${it.size||""}</div></div></div>`).join("");
  $("#rules").innerHTML = o.rules.length ? o.rules.sort((a,b) => b.weight - a.weight).map(r => `<div class="rule ${r.weight<0?"neg":""}">${r.weight>0?"＋":"－"} [${r.slot}] ${r.reason}<small>${r.url ? `<a href="${r.url}" target="_blank" rel="noopener">${r.source}</a>` : r.source}</small></div>`).join("") : `<span class="muted">이 체형·골격에 해당하는 규칙이 없어요</span>`;
  const pr = o.predicted || {};
  $("#predicted").innerHTML = Object.keys(pr).length ? Object.entries(pr).map(([slot, keys]) =>
    `<div class="rule"><b>${slot}</b> 자리에 어울릴 속성 (나머지 옷 기준): ${["카테고리","색상","핏","기장"].filter(k => keys[k]).map(k => `${k} ${keys[k].map(([v,p]) => `${v} ${(p*100).toFixed(0)}%`).join(" / ")}`).join(" · ")}</div>`).join("")
    : `<span class="muted">마스킹 모델이 아직 없어요</span>`;
  S.current = Object.fromEntries(o.items.map(it => [it.slot, it.id]));
}
function renderTurn(text, r) {
  const div = document.createElement("div"); div.className = "turn";
  const wants = r.intent.wants.map(w => `${w.slot||"전체"}:${w.want}`).join(", ") || "없음";
  div.innerHTML = `<div class="q">🗣 ${text || "새 코디 추천"}</div>
    <div class="intent">요청 해석 <code>${r.intent.parsed_by}</code> 유형 <code>${r.intent.type}</code> 슬롯 <code>${r.intent.slots.join(",")||"-"}</code> 방향 <code>${wants}</code> 상황 <code>${r.intent.occasion||"-"}</code></div>
    ${r.notes.map(n => `<div class="note">${n}</div>`).join("")}
    ${r.decisions.map(d => `<div class="dec"><div class="h"><b>${d.slot}</b><span><span class="pill ${d.status}">${{applied:"적용",kept:"유지",confirm:"확인 필요"}[d.status]}</span> <span class="muted">신뢰도 ${(d.confidence*100).toFixed(0)}%</span></span></div>
      ${d.options.map((o,k) => `<div class="opt ${o.label===d.choice?"chosen":""}" title="${Object.entries(o.parts).filter(([k])=>k!=="fitin_raw").map(([k,v])=>k+" "+v).join(" · ")}${o.notes.length?"\n"+o.notes.join("\n"):""}"><div class="t">${o.kind==="remove"?"✕":thumb(o.item)}</div><div>${o.label}<div class="pb"><div style="width:${(o.prob*100).toFixed(1)}%"></div></div></div><span class="muted">${(o.prob*100).toFixed(1)}%</span></div>`).join("")}
    </div>`).join("")}
    <div class="lat">결정 엔진 ${r.decider === "jev" ? "Jev" : "로컬(보정된 확률)"} · 요청 해석 ${r.latency_ms.intent} ms · 슬롯 결정 ${r.latency_ms.decide} ms · 전체 ${r.latency_ms.total} ms</div>
    <details><summary>결정 모델에 보낸 state</summary><pre>${r.state}</pre></details>`;
  $("#turns").prepend(div);
}
async function turn(text, fresh) {
  document.body.classList.add("loading");
  try {
    if (fresh) S.current = {};  // nothing worn yet: every slot is an open question
    const r = await api("/api/stylist", {profile: profile(), weather: weatherPayload(), text: fresh ? "" : text, occasion: S.occasion,
      current: S.current, wardrobe: WARDROBE, preference: S.pref, seed: S.seed++});
    renderOutfit(r.outfit); renderTurn(fresh ? "" : text, r);
  } catch (e) { $("#turns").insertAdjacentHTML("afterbegin", `<div class="note">오류: ${e.message}</div>`); }
  document.body.classList.remove("loading");
}
$("#newbtn").onclick = () => turn("", true);
$("#wxbtn").onclick = async () => {
  const w = await api("/api/weather"); if (w.error) { $("#wxlabel").textContent = "날씨를 못 가져왔어요"; return; }
  S.weather = w; $("#wxtemp").textContent = `${w.temp.toFixed(0)}°`; $("#temp").value = Math.round(w.apparent);
  $("#wxlabel").textContent = `서울 ${w.label} · 체감 ${w.apparent.toFixed(0)}° · 강수 ${w.precipitation}mm · 바람 ${w.wind}km/h`;
};
$("#temp").oninput = () => { S.weather = null; $("#wxtemp").textContent = $("#temp").value + "°"; $("#wxlabel").textContent = "직접 입력"; };
document.querySelectorAll("[data-preset]").forEach(b => b.onclick = () => setPreset(b.dataset.preset));
document.querySelectorAll("#fit button").forEach(b => b.onclick = () => { S.fit = b.dataset.v; document.querySelectorAll("#fit button").forEach(x => x.classList.toggle("on", x === b)); });
["chest","waist","hip","inseam","height"].forEach(k => $("#"+k).oninput = hint);
$("#examples").innerHTML = EXAMPLES.map(e => `<span class="chip">${e}</span>`).join("");
document.querySelectorAll("#examples .chip").forEach(c => c.onclick = () => turn(c.textContent, c.textContent.includes("새 코디")));
$("#occasion").innerHTML = OCC.map(o => `<span class="chip" data-o="${o}">${o}</span>`).join("");
document.querySelectorAll("#occasion .chip").forEach(c => c.onclick = () => { S.occasion = S.occasion === c.dataset.o ? null : c.dataset.o;
  document.querySelectorAll("#occasion .chip").forEach(x => x.classList.toggle("on", x.dataset.o === S.occasion)); });
$("#ward").innerHTML = WARDROBE.map(w => `<div class="item"><div class="thumb"><span class="sw" style="background:${w.attributes.colors[0]}"></span></div><div>${w.attributes.name}</div></div>`).join("");
(async () => {
  setPreset("female");
  const m = await api("/api/meta");
  $("#meta").textContent = `카탈로그 ${m.items.toLocaleString()}벌 · 결정 엔진 ${m.decider === "jev" ? "Jev" : "로컬"} (온도 ${m.temperature}) · 요청 해석 키워드 규칙`;
  $("#decider").textContent = m.decider === "jev" ? "Jev 결정 모델" : "로컬 결정 (Jev 계약)";
  $("#styles").innerHTML = m.styles.map(s => `<span class="chip ${S.styles.has(s)?"on":""}" data-s="${s}">${s}</span>`).join("");
  document.querySelectorAll("#styles .chip").forEach(c => c.onclick = () => { S.styles.has(c.dataset.s) ? S.styles.delete(c.dataset.s) : S.styles.add(c.dataset.s); c.classList.toggle("on"); });
  const f = m.masked || {}, cal = m.calibration || {};
  $("#report").innerHTML = `<tr><th>빈 슬롯 맞히기 (4지선다)</th><th>정답률</th></tr>
    <tr><td>무작위</td><td>25%</td></tr>
    <tr><td>PMI 궁합 (기존)</td><td>${f.pmi ? (f.pmi*100).toFixed(1)+"%" : "-"}</td></tr>
    <tr><td>팀원 마스킹 모델</td><td>${f.masked ? (f.masked*100).toFixed(1)+"%" : "-"}</td></tr>
    <tr><td>마스킹 (스타일 정보 없이)</td><td>${f["masked (no style)"] ? (f["masked (no style)"]*100).toFixed(1)+"%" : "-"}</td></tr>
    <tr><td>마스킹 + PMI</td><td>${f["masked + pmi"] ? (f["masked + pmi"]*100).toFixed(1)+"%" : "-"}</td></tr>
    <tr><td>상의+하의 코디, 앱 점수 (PMI + 마스킹 쌍 점수)</td><td>${(m.fitb_top_bottom||{})["pair + pmi (app)"] ? (m.fitb_top_bottom["pair + pmi (app)"]*100).toFixed(1)+"%" : "-"}</td></tr>
    <tr><td>결정 확률 보정 오차(ECE)</td><td>${cal.ece ? (cal.ece.default*100).toFixed(1)+"% → "+(cal.ece.calibrated*100).toFixed(1)+"%" : "-"}</td></tr>`;
  await turn("", true);
})();
</script>
</body>
</html>
